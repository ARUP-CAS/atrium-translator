version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "test"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "test"
    # Grouped to match the github-actions entry above and the other four repos —
    # this was the last ungrouped ecosystem in the ecosystem (#18).
    groups:
      pip-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "transformers"
        versions: [">= 5.0.0"]
      # Pinned exactly in requirements-test.txt and service/requirements.txt: the committed
      # service/openapi.json is a function of both (atrium-project#32 round 2). Bump them
      # together by hand and regenerate the spec in the same commit
      # (python atrium_openapi.py export --app service.api:app), so the release's
      # breaking-change check sees what the upgrade changes.
      - dependency-name: "fastapi"
      - dependency-name: "pydantic"
