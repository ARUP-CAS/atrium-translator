name: Docker Build & Push

on:
  push:
    branches: [ test, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ test, master ]

permissions:
  # security-events:write is required because docker-tool.reusable.yml's
  # build-and-push job uploads the post-publish Trivy SARIF. A reusable
  # workflow's permissions are CAPPED BY THIS BLOCK, so omitting it makes GitHub
  # reject the whole file at parse time with "requesting 'security-events:
  # write', but is only allowed 'security-events: none'" — a startup_failure,
  # not a step failure (#18). This repo sets permissions at WORKFLOW level (no
  # job-level block), so the grant belongs here.
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a tag build - that is a publish in flight
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-and-push:
    uses: ufal/atrium-project/.github/workflows/docker-tool.reusable.yml@v1
    with:
      image-name: ${{ github.repository }}
    secrets:
      # Explicit instead of `secrets: inherit` — the reusable declares and
      # needs only this one (#18). inherit handed it every repo secret.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
