# atrium-translator — pre-commit in CI
#
# Runs this repo's .pre-commit-config.yaml in CI so the hooks (ruff,
# whitespace/large-file guards) are enforced, not just available locally.
# Mirrors the alto-postprocess / page-classification callers.

name: pre-commit

on:
  pull_request:
    branches: [test, master]
  push:
    branches: [test, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
