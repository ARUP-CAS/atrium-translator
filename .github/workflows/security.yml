name: Security Scans

on:
  push:
    branches: [ test, master ]
  pull_request:
    branches: [ test, master ]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a tag build - that is a publish in flight
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  trivy-scan:
    uses: ufal/atrium-project/.github/workflows/security.reusable.yml@test
    with:
      image-ref: ghcr.io/ufal/atrium-translator:latest
