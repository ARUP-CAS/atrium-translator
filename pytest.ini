[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
markers =
    slow: marks tests that require ML models or network (deselect with -m "not slow")
    integration: exercises the real /translate path end to end against a local
        stub backend, with nothing mocked (tests/integration/). Deselected from
        the fast lane because each test starts an HTTP server and drives a whole
        document through the pipeline. Run with `pytest -m integration`.
env =
    LLM_BACKOFF_BASE_S=0.0
    LINDAT_BACKOFF_BASE_S=0.0
    LLM_MIN_INTERVAL_S=0.0
